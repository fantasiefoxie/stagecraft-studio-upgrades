  // Parabolic Escape Path for Betaal returning to the Banyan Canopy (u: 0..1 over t = 33.4..35.6)
  function getBetaalEscapePos(u) {
    const startX = 212, startY = 186, startZ = 22;
    const endX = BOUGH_HANG_X, endY = BOUGH_HANG_Y, endZ = BOUGH_HANG_Z + 2;
    const eu = smoothstep(u);
    const x = lerp(startX, endX, eu) - Math.sin(u * Math.PI) * 18;
    const y = lerp(startY, endY, eu);
    const z = lerp(startZ, endZ, eu) + Math.sin(u * Math.PI) * 44;
    return { x, y, z };
  }

  // Smooth damped camera state
  const cam = { x: 260, y: 150, zoom: 1.0 };

  function getCameraTarget(t) {
    if (t < 1.8) {
      // Wide moonlit establishing glide
      return { x: lerp(246, 272, smoothstep(t / 1.8)), y: 152, zoom: lerp(1.0, 1.06, t / 1.8) };
    } else if (t < 3.0) {
      // Punch in on Vikram spotting Betaal on the banyan bough
      return { x: 310, y: 146, zoom: 1.18 };
    } else if (t < 4.7) {
      // Dynamic leap tracking & landing
      const leapU = clamp((t - 3.0) / 1.35, 0, 1);
      const lift = Math.sin(leapU * Math.PI) * 14;
      const thump = (t >= 4.25 && t < 4.5) ? Math.sin((t - 4.25) * 35) * 2.2 : 0;
      return { x: 318, y: 140 - lift + thump, zoom: 1.22 };
    } else if (t < 7.0) {
      // Smoothly pull out as Vikram hoists Betaal and strides left into clearing frame
      const u = smoothstep((t - 4.7) / 2.2);
      return { x: lerp(312, 260, u), y: lerp(148, 148, u), zoom: lerp(1.16, 1.02, u) };
    } else if (t < 15.0) {
      // Clue I: anchored nicely with Vikram+Betaal on lower-left, Thought Cloud on upper-right!
      return { x: 256 + Math.sin((t - 7) * 0.4) * 4, y: 148, zoom: 1.02 };
    } else if (t < 23.0) {
      // Clue II: snappy subtle micro-zoom rhythm shift
      const punch = t < 15.35 ? 1.06 : 1.03;
      return { x: 264 + Math.sin((t - 15) * 0.5) * 4, y: 149, zoom: punch };
    } else if (t < 30.0) {
      // Clue III: gentle intimate zoom on moonlight clue
      const punch = t < 23.35 ? 1.07 : 1.04;
      return { x: 270, y: 148, zoom: punch };
    } else if (t < 33.4) {
      // The Verdict! Dramatic punch-in on Vikram & Betaal!
      return { x: 218, y: 162, zoom: 1.26 };
    } else {
      // Betaal darts back to the banyan canopy — camera pulls wide to show the whole moonlit clearing!
      const u = smoothstep((t - 33.4) / 1.8);
      return { x: lerp(230, 294, u), y: lerp(156, 144, u), zoom: lerp(1.22, 1.02, u) };
    }
  }

  // Compute exact world positions & poses of Vikram and Betaal for any time t in [0..36]
  function getActorsState(t) {
    let vikram = { x: 140, y: getPathY(140), z: 0, sprite: SPRITES.vikramIdle, flipX: false, emote: null };
    let betaal = { visible: true, x: BOUGH_HANG_X, y: BOUGH_HANG_Y, z: BOUGH_HANG_Z, sprite: SPRITES.betaalHang[0], flipX: false, emote: null };

    const walkFrame = Math.floor(t * 7.5) % 4;
    const hoverFrame = Math.floor(t * 5) % 2;

    if (t < 2.65) {
      // Striding briskly along the forest path toward the Banyan tree
      const u = smoothstep(t / 2.65);
      const vx = lerp(112, 286, u);
      const vy = getPathY(vx);
      vikram = { x: vx, y: vy, z: 0, sprite: SPRITES.vikramWalk[walkFrame], flipX: false, emote: null };
      if (t >= 1.9 && t < 2.95) {
        vikram.emote = { sym: '!', p: (t - 1.9) / 1.05, col: '#e6394c' };
      }
      betaal = { visible: true, x: BOUGH_HANG_X, y: BOUGH_HANG_Y, z: BOUGH_HANG_Z, sprite: SPRITES.betaalHang[Math.floor(t * 2.2) % 2], flipX: false, emote: null };
    } else if (t < 3.0) {
      // Heroic crouch before parabolic leap!
      const vx = 286;
      vikram = { x: vx, y: getPathY(vx), z: 0, sprite: SPRITES.vikramCrouch, flipX: false, emote: null };
      betaal = { visible: true, x: BOUGH_HANG_X, y: BOUGH_HANG_Y, z: BOUGH_HANG_Z, sprite: SPRITES.betaalHang[Math.floor(t * 3) % 2], flipX: false, emote: null };
    } else if (t < 4.3) {
      // Parabolic Leap Arc up to grab Betaal off the bough!
      const u = clamp((t - 3.0) / 1.3, 0, 1);
      const vx = lerp(286, 312, u);
      const vy = lerp(getPathY(286), getPathY(312), u);
      const vz = 4 * 40 * u * (1 - u); // Crisp 40px parabolic arc peak right at bough height!
      const grabbed = u >= 0.5;
      vikram = { x: vx, y: vy, z: vz, sprite: grabbed ? SPRITES.vikramCarryIdle : SPRITES.vikramLeap, flipX: false, emote: null };
      if (!grabbed) {
        betaal = { visible: true, x: BOUGH_HANG_X, y: BOUGH_HANG_Y, z: BOUGH_HANG_Z, sprite: SPRITES.betaalHang[1], flipX: false, emote: { sym: '!', p: clamp((u - 0.15) / 0.4, 0, 0.9), col: '#ff294d' } };
      } else {
        betaal.visible = false; // Now hoisted onto Vikram's back!
      }
    } else if (t < 4.65) {
      // Solid heroic landing with Betaal hoisted onto his back
      const vx = 312;
      vikram = { x: vx, y: getPathY(vx), z: 0, sprite: SPRITES.vikramCarryIdle, flipX: false, emote: null };
      betaal.visible = false;
    } else if (t < 7.0) {
      // Strides steadily leftward to center-left clearing spot to open frame for Thought Clouds
      const u = smoothstep((t - 4.65) / 2.35);
      const vx = lerp(312, 168, u);
      vikram = { x: vx, y: getPathY(vx), z: 0, sprite: SPRITES.vikramCarry[walkFrame], flipX: true, emote: null };
      betaal.visible = false;
    } else if (t < 30.0) {
      // Slow purposeful walk along the moonlit clearing path while Betaal tells the 3 Clues!
      // Cycles smoothly across the lower-left path (x = 152..216) keeping composition locked & clean
      const walkU = (t - 7.0) / 23.0;
      const vx = lerp(154, 212, smoothstep(walkU));
      const vy = getPathY(vx);
      vikram = { x: vx, y: vy, z: 0, sprite: SPRITES.vikramCarry[Math.floor(t * 5.2) % 4], flipX: false, emote: null };
      // Betaal '?' emote when posing the riddle question at 27.0..29.8s!
      if (t >= 27.0 && t < 29.85) {
        vikram.emote = { sym: '?', p: (t - 27.0) / 2.85, col: '#9d4edd', dx: -6, dy: -4 };
      }
      betaal.visible = false;
    } else if (t < 33.4) {
      // THE VERDICT: Vikram stops decisively and delivers the answer!
      const vx = 212;
      const vy = getPathY(vx);
      vikram = { x: vx, y: vy, z: 0, sprite: SPRITES.vikramCarryIdle, flipX: false, emote: null };
      if (t >= 30.15 && t < 31.6) {
        vikram.emote = { sym: '!', p: (t - 30.15) / 1.45, col: '#f0c24b' };
      }
      betaal.visible = false;
    } else {
      // BETAAL ESCAPES! Vikram draws his verdict stance looking back right as Betaal floats/darts to the banyan!
      const vx = 212;
      const vy = getPathY(vx);
      vikram = { x: vx, y: vy, z: 0, sprite: SPRITES.vikramVerdict, flipX: false, emote: null };
      if (t >= 34.0 && t < 35.4) {
        vikram.emote = { sym: '!', p: (t - 34.0) / 1.4, col: '#e6394c' };
      }

      const escU = clamp((t - 33.4) / 2.2, 0, 1);
      if (escU < 0.96) {
        const pos = getBetaalEscapePos(escU);
        const sp = escU < 0.25 ? SPRITES.betaalHover[hoverFrame] : SPRITES.betaalDart[hoverFrame];
        betaal = { visible: true, x: pos.x, y: pos.y, z: pos.z, sprite: sp, flipX: false, emote: null };
      } else {
        // Safely perched upside-down back on the banyan bough!
        betaal = { visible: true, x: BOUGH_HANG_X, y: BOUGH_HANG_Y, z: BOUGH_HANG_Z, sprite: SPRITES.betaalHang[Math.floor(t * 3) % 2], flipX: false, emote: null };
      }
    }

    return { vikram, betaal };
  }

  // =========================================================================
  // 11. MAIN FRAME RENDERER (480x270 Pixel World -> 1920x1080 Crisp Upscale + RPG UI)
  // =========================================================================
  function drawSprite(g, spr, x, y, z = 0, flipX = false) {
    const dx = Math.round(x);
    const dy = Math.round(y - z);
    if (!flipX) {
      g.drawImage(spr.canvas, dx - spr.ax, dy - spr.ay);
    } else {
      g.save();
      g.translate(dx, dy);
      g.scale(-1, 1);
      g.drawImage(spr.canvas, -spr.ax, -spr.ay);
      g.restore();
    }
  }

  function renderFrame(frameIdx) {
    const t = frameIdx / FPS;

    // 1. Update damped camera
    const target = getCameraTarget(t);
    if (frameIdx === 0 || Math.abs(cam.x - target.x) > 80) {
      cam.x = target.x;
      cam.y = target.y;
      cam.zoom = target.zoom;
    } else {
      const k = 0.14;
      cam.x = lerp(cam.x, target.x, k);
      cam.y = lerp(cam.y, target.y, k);
      cam.zoom = lerp(cam.zoom, target.zoom, k);
    }

    // Clamp camera so world edges never show black gaps
    const halfViewW = (LOG_W / 2) / cam.zoom;
    const halfViewH = (LOG_H / 2) / cam.zoom;
    const cx = clamp(cam.x, halfViewW, WORLD_W - halfViewW);
    const cy = clamp(cam.y, halfViewH, WORLD_H - halfViewH);

    // 2. Render Nocturnal World onto 480x270 Logical Pixel Buffer
    lowCtx.save();
    lowCtx.fillStyle = '#090c1c';
    lowCtx.fillRect(0, 0, LOG_W, LOG_H);

    lowCtx.translate(LOG_W / 2, LOG_H / 2);
    lowCtx.scale(cam.zoom, cam.zoom);
    lowCtx.translate(-Math.round(cx), -Math.round(cy));

    // Pre-baked sky, cratered moon, emerald grass & dirt path
    lowCtx.drawImage(worldBg, 0, 0);

    // Soft radial warm Diya oil lamp pools on the ground
    for (let i = 0; i < DIYAS.length; i++) {
      const d = DIYAS[i];
      const flick = 0.88 + 0.12 * Math.sin(t * 14 + i * 2.1);
      const r = 34 * flick;
      const grad = lowCtx.createRadialGradient(d.x, d.y - 4, 2, d.x, d.y - 4, r);
      grad.addColorStop(0, 'rgba(255, 200, 84, 0.42)');
      grad.addColorStop(0.45, 'rgba(245, 138, 38, 0.18)');
      grad.addColorStop(1, 'rgba(245, 138, 38, 0)');
      lowCtx.fillStyle = grad;
      lowCtx.beginPath();
      lowCtx.arc(d.x, d.y - 4, r, 0, Math.PI * 2);
      lowCtx.fill();
    }

    // Actors state
    const { vikram, betaal } = getActorsState(t);

    // Ground contact shadows under Vikram & Betaal
    lowCtx.fillStyle = 'rgba(8, 11, 22, 0.46)';
    const vShR = Math.max(4, Math.round(7 - vikram.z * 0.08));
    lowCtx.fillRect(Math.round(vikram.x - vShR), Math.round(vikram.y - 2), vShR * 2, 4);
    if (betaal.visible) {
      const bShR = Math.max(3, Math.round(6 - betaal.z * 0.06));
      lowCtx.fillRect(Math.round(betaal.x - bShR), Math.round(betaal.y - 1), bShR * 2, 3);
    }

    // Build Y-sorted draw queue (all SpriteStacks + Characters + Diya flames!)
    const drawList = [];
    for (const p of STATIC_PROPS) {
      drawList.push(p);
    }
    drawList.push({
      sortY: vikram.y,
      render: (g) => {
        drawSprite(g, vikram.sprite, vikram.x, vikram.y, vikram.z, vikram.flipX);
        if (vikram.emote) {
          drawEmoteBubble(
            g,
            vikram.x + (vikram.emote.dx || 0),
            vikram.y - vikram.z - 28 + (vikram.emote.dy || 0),
            vikram.emote.sym,
            vikram.emote.p,
            vikram.emote.col
          );
        }
      }
    });
    if (betaal.visible) {
      drawList.push({
        sortY: betaal.y + 1,
        render: (g) => {
          // Subtle ghostly cyan-violet shimmer when hovering/escaping
          if (t >= 33.4 && t < 35.5) {
            const aura = g.createRadialGradient(betaal.x, betaal.y - betaal.z - 10, 2, betaal.x, betaal.y - betaal.z - 10, 22);
            aura.addColorStop(0, 'rgba(186, 214, 247, 0.42)');
            aura.addColorStop(0.6, 'rgba(255, 48, 92, 0.14)');
            aura.addColorStop(1, 'rgba(186, 214, 247, 0)');
            g.fillStyle = aura;
            g.beginPath();
            g.arc(betaal.x, betaal.y - betaal.z - 10, 22, 0, Math.PI * 2);
            g.fill();
          }
          drawSprite(g, betaal.sprite, betaal.x, betaal.y, betaal.z, betaal.flipX);
          if (betaal.emote) {
            drawEmoteBubble(g, betaal.x, betaal.y - betaal.z - 25, betaal.emote.sym, betaal.emote.p, betaal.emote.col);
          }
        }
      });
    }

    drawList.sort((a, b) => a.sortY - b.sortY);

    for (const item of drawList) {
      if (item.render) {
        item.render(lowCtx);
      } else {
        drawSprite(lowCtx, item.sprite, item.x, item.y, 0, false);
        if (item.isDiya) {
          // Animated crisp flickering flame pixel atop each Diya!
          const sway = Math.round(Math.sin(t * 16 + item.x) * 0.7);
          const fx = Math.round(item.x) + sway;
          const fy = Math.round(item.y) - 11;
          lowCtx.fillStyle = '#ff7b1c';
          lowCtx.fillRect(fx - 1, fy - 2, 3, 3);
          lowCtx.fillStyle = '#ffd84d';
          lowCtx.fillRect(fx, fy - 3, 1, 3);
          lowCtx.fillStyle = '#fff9c4';
          lowCtx.fillRect(fx, fy - 1, 1, 1);
        }
      }
    }

    // Event particles (banyan leaf burst, landing dust, spectral escape trail)
    drawEventParticles(lowCtx, t);

    // Drifting golden-lime fireflies
    for (const f of fireflies) {
      const fx = f.bx + Math.sin(t * f.spdX + f.ph) * f.ampX;
      const fy = f.by + Math.cos(t * f.spdY + f.ph * 1.3) * f.ampY;
      const glow = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * f.blinkSpd + f.ph));
      lowCtx.globalAlpha = glow * 0.35;
      lowCtx.fillStyle = '#e4ff7a';
      lowCtx.fillRect(Math.round(fx) - 1, Math.round(fy) - 1, 3, 3);
      lowCtx.globalAlpha = glow;
      lowCtx.fillStyle = '#ffffc2';
      lowCtx.fillRect(Math.round(fx), Math.round(fy), 1, 1);
    }
    lowCtx.globalAlpha = 1;

    lowCtx.restore();

    // 3. Screen-space Scalloped 16-bit Thought Clouds (Acts II, III, IV) on 480x270 buffer!
    // Compute Betaal's current screen coordinates so thought puffs rise directly from his head!
    const betaalScreenX = (vikram.x - 4 - cx) * cam.zoom + LOG_W / 2;
    const betaalScreenY = (vikram.y - 24 - cy) * cam.zoom + LOG_H / 2;

    if (t >= 7.0 && t < 15.0) {
      drawScallopedCloud(lowCtx, betaalScreenX, betaalScreenY, 1, t - 7.0, 8.0);
    } else if (t >= 15.0 && t < 23.0) {
      drawScallopedCloud(lowCtx, betaalScreenX, betaalScreenY, 2, t - 15.0, 8.0);
    } else if (t >= 23.0 && t < 30.0) {
      drawScallopedCloud(lowCtx, betaalScreenX, betaalScreenY, 3, t - 23.0, 7.0);
    }

    // 4. Crisp Exact 4x Nearest-Neighbor Blit to 1920x1080 Master Canvas
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lowCanvas, 0, 0, LOG_W, LOG_H, 0, 0, OUT_W, OUT_H);

    // 5. Crisp Opening Title Card (0.0s - 1.85s)
    if (t < 1.88) {
      renderTitleCard(ctx, t);
    }

    // 6. Pinned Bottom 16-Bit Stardew-Style RPG Dialogue Box (with Pixel Portrait)
    const activeCue = findActiveDialogue(t);
    if (activeCue) {
      renderDialogueBox(ctx, activeCue, t);
    }

    // Subtle crisp fade-in on very first 0.25s
    if (t < 0.25) {
      ctx.fillStyle = `rgba(7, 9, 19, ${1 - t / 0.25})`;
      ctx.fillRect(0, 0, OUT_W, OUT_H);
    }
  }

  function findActiveDialogue(t) {
    for (let i = 0; i < DIALOGUE_CUES.length; i++) {
      const c = DIALOGUE_CUES[i];
      if (t >= c.start && t <= c.end) return c;
    }
    return null;
  }

  // --- CRISP TITLE CARD (1920x1080 Pixel-Framed Wooden & Gold Banner) ---
  function renderTitleCard(g, t) {
    const fadeIn = smoothstep(clamp(t / 0.28, 0, 1));
    const fadeOut = smoothstep(clamp((1.88 - t) / 0.28, 0, 1));
    const alpha = Math.min(fadeIn, fadeOut);
    if (alpha <= 0.01) return;

    g.save();
    g.globalAlpha = alpha;

    // Subtle dark scrim band for effortless 4.5:1+ legibility
    const bx = 360, by = 140, bw = 1200, bh = 256;
    const p = 4; // 4px pixel-grid unit matching 4x scale

    // Outer dark ink border
    g.fillStyle = '#110f22';
    g.fillRect(bx - p * 2, by - p * 2, bw + p * 4, bh + p * 4);

  // --- PINNED BOTTOM STARDEW-INSPIRED RPG DIALOGUE BOX (1920x1080) ---
  function wrapCanvasText(g, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (g.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function renderDialogueBox(g, cue, t) {
    const p = 4; // Crisp 4px pixel unit
    const boxW = 1640;
    const boxH = 212;
    const boxX = (OUT_W - boxW) / 2;
    const boxY = OUT_H - boxH - 28;

    // Subtle drop shadow
    g.fillStyle = 'rgba(5, 7, 15, 0.55)';
    g.fillRect(boxX + 8, boxY + 10, boxW, boxH);

    // Outer pixel ink border
    g.fillStyle = '#1a110c';
    g.fillRect(boxX - p, boxY - p, boxW + p * 2, boxH + p * 2);

    // Carved Stardew Valley warm timber frame
    g.fillStyle = '#633820';
    g.fillRect(boxX, boxY, boxW, boxH);
    g.fillStyle = '#9e6238';
    g.fillRect(boxX + p, boxY + p, boxW - p * 2, boxH - p * 2);
    g.fillStyle = '#4a2816';
    g.fillRect(boxX + p * 3, boxY + p * 3, boxW - p * 6, boxH - p * 6);

    // Warm parchment interior
    g.fillStyle = '#f5e6c4';
    g.fillRect(boxX + p * 4, boxY + p * 4, boxW - p * 8, boxH - p * 8);
    // Subtle inner parchment top-left highlight & bottom bevel
    g.fillStyle = '#fcf2da';
    g.fillRect(boxX + p * 4, boxY + p * 4, boxW - p * 8, p * 2);
    g.fillStyle = '#dbc496';
    g.fillRect(boxX + p * 4, boxY + boxH - p * 6, boxW - p * 8, p * 2);

    // Corner brass rivets
    const rivets = [
      [boxX + p, boxY + p],
      [boxX + boxW - p * 3, boxY + p],
      [boxX + p, boxY + boxH - p * 3],
      [boxX + boxW - p * 3, boxY + boxH - p * 3]
    ];
    for (const [rx, ry] of rivets) {
      g.fillStyle = '#f2c44d';
      g.fillRect(rx, ry, p * 2, p * 2);
      g.fillStyle = '#875512';
      g.fillRect(rx + p, ry + p, p, p);
    }

    // Pixel-Art Character Portrait Frame (Left inside dialogue box)
    const portSize = 144; // 36 * 4 (32px art + frame)
    const portX = boxX + 34;
    const portY = boxY + (boxH - portSize) / 2;

    g.fillStyle = '#3b2113';
    g.fillRect(portX - p, portY - p, portSize + p * 2, portSize + p * 2);
    g.fillStyle = '#d9a43b';
    g.fillRect(portX, portY, portSize, portSize);
    g.fillStyle = '#141121';
    g.fillRect(portX + p, portY + p, portSize - p * 2, portSize - p * 2);

    const localT = t - cue.start;
    const revealDur = Math.min(1.05, (cue.end - cue.start) * 0.42);
    const charRatio = clamp(localT / revealDur, 0, 1);
    const isSpeaking = charRatio < 0.98 && (Math.floor(t * 11) % 2 === 0);

    const portraitImg = cue.speaker === 'vikram'
      ? (isSpeaking ? PORTRAITS.vikramTalk : PORTRAITS.vikramIdle)
      : (isSpeaking ? PORTRAITS.betaalTalk : PORTRAITS.betaalIdle);

    g.imageSmoothingEnabled = false;
    g.drawImage(portraitImg, 0, 0, 32, 32, portX + p * 2, portY + p * 2, 128, 128);

    // Speaker Nameplate & Crisp Subtitle Column
    const textX = portX + portSize + 36;
    const textMaxW = boxX + boxW - textX - 54;

    g.textAlign = 'left';
    g.textBaseline = 'top';
    g.font = '800 28px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';
    g.fillStyle = cue.speaker === 'vikram' ? '#8c182c' : '#3a1d6b';
    g.fillText(cue.name, textX, boxY + 32);

    // Subtle hairline separator under speaker name
    g.fillStyle = 'rgba(99, 56, 32, 0.28)';
    g.fillRect(textX, boxY + 68, textMaxW, 3);

    // Snappy typewriter reveal of crisp dark-espresso ink subtitle text
    const visibleCount = Math.max(1, Math.floor(cue.text.length * charRatio));
    const shownText = cue.text.slice(0, visibleCount);

    g.font = '700 38px Georgia, "Palatino Linotype", "Book Antiqua", serif';
    g.fillStyle = '#24140b';
    const lines = wrapCanvasText(g, shownText, textMaxW);
    for (let i = 0; i < Math.min(2, lines.length); i++) {
      g.fillText(lines[i], textX, boxY + 86 + i * 48);
    }

    // Bouncing RPG continue chevron when line is fully revealed
    if (charRatio >= 0.99) {
      const bob = Math.round(Math.sin(t * 9) * 4);
      const ax = boxX + boxW - 44;
      const ay = boxY + boxH - 42 + bob;
      g.fillStyle = '#8c182c';
      g.fillRect(ax - 12, ay, 24, 4);
      g.fillRect(ax - 8, ay + 4, 16, 4);
      g.fillRect(ax - 4, ay + 8, 8, 4);
      g.fillRect(ax - 2, ay + 12, 4, 4);
    }
  }

  // =========================================================================
  // 12. WEBAUDIO PROCEDURAL RAAG BHAIRAVI SCORE (Plucked Harp & Bansuri Flute)
  // =========================================================================
  class RaagBhairaviAudio {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.recordDest = null;
      this.droneNodes = [];
      this.unlocked = false;
      this.muted = false;
      this.lastStep = -1;
      this.lastCueIdx = -1;
      // Raag Bhairavi scale degrees in semitones above D4 (Sa = 293.66 Hz):
      // Sa(0), komal Re(1), komal Ga(3), Ma(5), Pa(7), komal Dha(8), komal Ni(10), Sa'(12)
      this.scale = [0, 1, 3, 5, 7, 8, 10, 12, 13, 15, 17];
      this.baseFreq = 293.6648; // D4
    }

    freq(degIdx, octShift = 0) {
      const semi = this.scale[((degIdx % this.scale.length) + this.scale.length) % this.scale.length] + octShift * 12;
      return this.baseFreq * Math.pow(2, semi / 12);
    }

    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.62;

        // Warm subtle stereo echo bus
        this.delayL = this.ctx.createDelay(0.6);
        this.delayL.delayTime.value = 0.24;
        this.delayGain = this.ctx.createGain();
        this.delayGain.gain.value = 0.24;
        this.delayFilter = this.ctx.createBiquadFilter();
        this.delayFilter.type = 'lowpass';
        this.delayFilter.frequency.value = 1800;

        this.delayL.connect(this.delayFilter);
        this.delayFilter.connect(this.delayGain);
        this.delayGain.connect(this.master);
        this.delayGain.connect(this.delayL);

        this.master.connect(this.ctx.destination);

        // Recording stream destination so MediaRecorder captures audio + 1080p60 video!
        if (this.ctx.createMediaStreamDestination) {
          this.recordDest = this.ctx.createMediaStreamDestination();
          this.master.connect(this.recordDest);
        }

        this.startTanpuraDrone();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      this.unlocked = true;
      return true;
    }

    startTanpuraDrone() {
      const now = this.ctx.currentTime;
      const droneFreqs = [73.42, 110.0, 146.83, 147.25]; // D2, A2, D3, slight shimmer D3
      const droneBus = this.ctx.createGain();
      droneBus.gain.value = 0.085;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 420;
      filter.Q.value = 1.4;

      droneBus.connect(filter);
      filter.connect(this.master);

      for (const f of droneFreqs) {
        const osc = this.ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now);
        osc.connect(droneBus);
        osc.start(now);
        this.droneNodes.push(osc);
      }
      this.droneBus = droneBus;
    }

    setMuted(m) {
      this.muted = m;
      if (this.master && this.ctx) {
        this.master.gain.setTargetAtTime(m ? 0 : 0.62, this.ctx.currentTime, 0.04);
      }
    }

    setPlaying(isPlaying) {
      if (!this.droneBus || !this.ctx) return;
      this.droneBus.gain.setTargetAtTime(isPlaying ? 0.085 : 0.0, this.ctx.currentTime, 0.08);
    }

    reset() {
      this.lastStep = -1;
      this.lastCueIdx = -1;
    }

    playPluckedHarp(deg, octShift = 0, vol = 0.22, dur = 0.65) {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      const f = this.freq(deg, octShift);

      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(f, now);
      osc2.frequency.setValueAtTime(f * 2, now);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(f * 6.5, now);
      filter.frequency.exponentialRampToValueAtTime(Math.max(220, f * 1.3), now + dur);
      filter.Q.value = 2.4;

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);

      const g2 = this.ctx.createGain();
      g2.gain.value = 0.22;

      osc1.connect(filter);
      osc2.connect(g2);
      g2.connect(filter);
      filter.connect(gain);
      gain.connect(this.master);
      gain.connect(this.delayL);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + dur + 0.05);
      osc2.stop(now + dur + 0.05);
    }

    playBansuriFlute(deg, prevDeg, octShift = 0, vol = 0.16, dur = 0.85) {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      const fTarget = this.freq(deg, octShift);
      const fStart = prevDeg !== null ? this.freq(prevDeg, octShift) : fTarget * 0.96;

      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(fStart, now);
      osc.frequency.exponentialRampToValueAtTime(fTarget, now + 0.09);

      // Gentle expressive flute vibrato
      const vib = this.ctx.createOscillator();
      const vibGain = this.ctx.createGain();
      vib.frequency.value = 5.4;
      vibGain.gain.setValueAtTime(0, now);
      vibGain.gain.linearRampToValueAtTime(fTarget * 0.012, now + 0.25);
      vib.connect(vibGain);
      vibGain.connect(osc.frequency);

      // Soft warm 2nd harmonic breath overtone
      const over = this.ctx.createOscillator();
      over.type = 'triangle';
      over.frequency.setValueAtTime(fTarget * 2, now);
      const overGain = this.ctx.createGain();
      overGain.gain.value = 0.06;

      const env = this.ctx.createGain();
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(vol, now + 0.12);
      env.gain.setValueAtTime(vol * 0.85, now + dur * 0.65);
      env.gain.exponentialRampToValueAtTime(0.0008, now + dur);

      osc.connect(env);
      over.connect(overGain);
      overGain.connect(env);
      env.connect(this.master);
      env.connect(this.delayL);

      osc.start(now);
      over.start(now);
      vib.start(now);
      osc.stop(now + dur + 0.06);
      over.stop(now + dur + 0.06);
      vib.stop(now + dur + 0.06);
    }

    playFoleyChime(type) {
      if (!this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      if (type === 'leap') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.24);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.16, now + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'cloud') {
        this.playPluckedHarp(4, 1, 0.16, 0.4);
        setTimeout(() => this.playPluckedHarp(7, 1, 0.14, 0.45), 75);
      } else if (type === 'verdict') {
        this.playPluckedHarp(0, 0, 0.26, 1.1);
        this.playPluckedHarp(4, 0, 0.22, 1.1);
        this.playPluckedHarp(7, 0, 0.24, 1.2);
      } else if (type === 'escape') {
        // Mischievous rapid ascending Bhairavi flourish
        [2, 3, 4, 5, 6, 7].forEach((deg, idx) => {
          setTimeout(() => this.playPluckedHarp(deg, 1, 0.14, 0.35), idx * 55);
        });
      }
    }

    update(t, isPlaying) {
      if (!this.unlocked || !this.ctx || !isPlaying) return;

      // 8th-note grid at 136 BPM (~0.2206s per step) — snappy Short cadence!
      const stepDur = 0.2206;
      const step = Math.floor(t / stepDur);
      if (step !== this.lastStep && step >= 0) {
        this.lastStep = step;

        // Harp rhythmic Bhairavi ostinato tailored by Act
        const harpMotifA = [0, 4, 2, 3, 4, 5, 4, 2, 1, 2, 0, 4, 3, 2, 1, 0];
        const harpMotifB = [4, 5, 6, 7, 5, 4, 3, 2, 3, 4, 5, 4, 2, 1, 2, 0];
        const motif = (t >= 15 && t < 30) ? harpMotifB : harpMotifA;
        const note = motif[step % motif.length];

        if (step % 2 === 0 || (t >= 3.0 && t < 4.5) || t >= 33.4) {
          this.playPluckedHarp(note, t >= 33.4 ? 1 : 0, 0.18, 0.58);
        } else if (step % 4 === 1) {
          // Soft bass Sa/Pa pulse
          this.playPluckedHarp(step % 8 === 1 ? 0 : 4, -1, 0.14, 0.72);
        }

        // Expressive Bansuri Flute phrases every 4 steps
        const flutePhrase = [
          [7, 5], [5, 7], [4, 5], [2, 4],
          [3, 2], [4, 3], [2, 4], [0, 2],
          [4, 2], [5, 4], [6, 5], [7, 6],
          [5, 7], [3, 5], [1, 3], [0, 1]
        ];
        if (step % 4 === 0 && t > 0.3 && t < 35.4) {
          const phraseIdx = Math.floor(step / 4) % flutePhrase.length;
          const [deg, prev] = flutePhrase[phraseIdx];
          this.playBansuriFlute(deg, prev, t >= 23 && t < 30 ? 1 : 0, 0.14, 0.88);
        }
      }

      // Story beat foley triggers
      let cueId = 0;
      if (t >= 3.0 && t < 3.4) cueId = 1;
      else if (t >= 7.0 && t < 7.3) cueId = 2;
      else if (t >= 15.0 && t < 15.3) cueId = 3;
      else if (t >= 23.0 && t < 23.3) cueId = 4;
      else if (t >= 30.05 && t < 30.4) cueId = 5;
      else if (t >= 33.4 && t < 33.8) cueId = 6;

      if (cueId !== 0 && cueId !== this.lastCueIdx) {
        this.lastCueIdx = cueId;
        if (cueId === 1) this.playFoleyChime('leap');
        else if (cueId === 2 || cueId === 3 || cueId === 4) this.playFoleyChime('cloud');
        else if (cueId === 5) this.playFoleyChime('verdict');
        else if (cueId === 6) this.playFoleyChime('escape');
      }
    }
  }

  const audio = new RaagBhairaviAudio();

  // =========================================================================

  // =========================================================================

  const playPauseLabel = document.getElementById('playPauseLabel');

  const SVG_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>';
  const SVG_VOL   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
  const SVG_MUTE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';

  let isPlaying = true;
  let currentFrame = 0;
  let lastTs = 0;
  let frameAcc = 0;

  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let hudTimer = null;
  let toastTimer = null;

  function formatTime(sec) {
    const s = Math.floor(clamp(sec, 0, TOTAL_SECONDS));
    return '00:' + (s < 10 ? '0' + s : '' + s);
  }

  function syncUI() {
    playPauseIcon.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;
    playPauseLabel.textContent = isPlaying ? 'Pause' : (currentFrame >= TOTAL_FRAMES - 1 ? 'Replay' : 'Play');
    muteIcon.innerHTML = audio.muted ? SVG_MUTE : SVG_VOL;
    muteLabel.textContent = audio.muted ? 'Muted' : 'Sound On';
    theatreLabel.textContent = document.body.classList.contains('theatre-mode') ? 'Exit Theatre' : 'Theatre';

    const t = currentFrame / FPS;
    beatLabel.textContent = getBeatTitle(t);
    timeReadout.textContent = `${formatTime(t)} / 00:36`;
    scrubberFill.style.width = `${(currentFrame / TOTAL_FRAMES) * 100}%`;
    scrubber.setAttribute('aria-valuenow', t.toFixed(1));
  }

  function unlockAudioSafely() {
    if (!audio.unlocked) {
      audio.unlock();
      audioUnlockPrompt.classList.add('hidden');
      audio.setPlaying(isPlaying);
    } else if (audio.ctx && audio.ctx.state === 'suspended') {
      audio.ctx.resume().catch(() => {});
      audioUnlockPrompt.classList.add('hidden');
    }
  }

  function togglePlayPause() {
    unlockAudioSafely();
    if (!isPlaying && currentFrame >= TOTAL_FRAMES - 1) {
      replayShort();
      return;
    }
    isPlaying = !isPlaying;
    audio.setPlaying(isPlaying);
    lastTs = performance.now();
    syncUI();
  }

  function replayShort() {
    unlockAudioSafely();
    currentFrame = 0;
    frameAcc = 0;
    isPlaying = true;
    audio.reset();
    audio.setPlaying(true);
    lastTs = performance.now();
    renderFrame(0);
    syncUI();
  }

  function toggleMute() {
    unlockAudioSafely();
    audio.setMuted(!audio.muted);
    syncUI();
  }

  function setTheatreMode(enabled) {
    if (enabled) {
      document.body.classList.add('theatre-mode', 'show-hud');
      theatreToast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => theatreToast.classList.remove('visible'), 2400);
      scheduleHudHide();
    } else {
      document.body.classList.remove('theatre-mode', 'show-hud');
      theatreToast.classList.remove('visible');
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }
    syncUI();
  }

  function scheduleHudHide() {
    clearTimeout(hudTimer);
    if (!document.body.classList.contains('theatre-mode')) return;
    document.body.classList.add('show-hud');
    hudTimer = setTimeout(() => {
      if (document.body.classList.contains('theatre-mode')) {
        document.body.classList.remove('show-hud');
      }
    }, 2200);
  }

  function startOrStopRecording() {
    unlockAudioSafely();
    if (isRecording) {
      stopRecording();
      return;
    }
    if (typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
      recordLabel.textContent = 'Recording Unavailable';
      setTimeout(() => { recordLabel.textContent = 'Record (.webm)'; }, 2200);
      return;
    }

    try {
      const videoStream = canvas.captureStream(FPS);
      const tracks = [...videoStream.getVideoTracks()];
      if (audio.recordDest && !audio.muted) {
        const audioTracks = audio.recordDest.stream.getAudioTracks();
        if (audioTracks.length > 0) tracks.push(...audioTracks);
      }
      const combinedStream = new MediaStream(tracks);

      const mimeCandidates = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm;codecs=vp9',
        'video/webm'
      ];
      let chosenMime = '';
      for (const m of mimeCandidates) {
        if (MediaRecorder.isTypeSupported(m)) { chosenMime = m; break; }
      }

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(
        combinedStream,
        chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: 10_000_000 } : { videoBitsPerSecond: 10_000_000 }
      );

      mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
      };

      mediaRecorder.onstop = () => {
        isRecording = false;
        btnRecord.classList.remove('recording');
        recordLabel.textContent = 'Record (.webm)';
        if (recordedChunks.length > 0) {
          const blob = new Blob(recordedChunks, { type: chosenMime || 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'vikram_betaal_stardew_short.webm';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
      };

      // Restart cleanly from 00:00 so recording captures the full 36-second 1080p60 short!
      replayShort();
      mediaRecorder.start(250);
      isRecording = true;
      btnRecord.classList.add('recording');
      recordLabel.textContent = 'Stop & Save (.webm)';
    } catch (err) {
      isRecording = false;
      btnRecord.classList.remove('recording');
      recordLabel.textContent = 'Record (.webm)';
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  }

  // Scrubber seeking
  function seekFromEvent(ev) {
    const rect = scrubber.getBoundingClientRect();
    const ratio = clamp((ev.clientX - rect.left) / rect.width, 0, 1);
    currentFrame = Math.min(TOTAL_FRAMES - 1, Math.floor(ratio * TOTAL_FRAMES));
    audio.reset();
    renderFrame(currentFrame);
    syncUI();
  }

  let isScrubbing = false;
  scrubber.addEventListener('pointerdown', (ev) => {
    unlockAudioSafely();
    isScrubbing = true;
    scrubber.setPointerCapture(ev.pointerId);
    seekFromEvent(ev);
  });
  scrubber.addEventListener('pointermove', (ev) => {
    if (isScrubbing) seekFromEvent(ev);
  });
  scrubber.addEventListener('pointerup', () => { isScrubbing = false; });

  // Event listeners
  btnPlayPause.addEventListener('click', togglePlayPause);
  btnReplay.addEventListener('click', replayShort);
  btnMute.addEventListener('click', toggleMute);
  btnTheatre.addEventListener('click', () => setTheatreMode(!document.body.classList.contains('theatre-mode')));
  btnRecord.addEventListener('click', startOrStopRecording);
  audioUnlockPrompt.addEventListener('click', () => {
    unlockAudioSafely();
    audio.setMuted(false);
    syncUI();
  });
  canvas.addEventListener('click', () => {
    if (!audio.unlocked) {
      unlockAudioSafely();
      audio.setMuted(false);
      syncUI();
    } else {
      togglePlayPause();
    }
  });
  window.addEventListener('mousemove', () => {
    if (document.body.classList.contains('theatre-mode')) scheduleHudHide();
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (document.body.classList.contains('theatre-mode')) {
        setTheatreMode(false);
      }
    } else if (ev.code === 'Space') {
      ev.preventDefault();
      togglePlayPause();
    } else if (ev.key === 'r' || ev.key === 'R') {
      replayShort();
    } else if (ev.key === 'm' || ev.key === 'M') {
      toggleMute();
    } else if (ev.key === 't' || ev.key === 'T') {
      setTheatreMode(!document.body.classList.contains('theatre-mode'));
    }
  });

  // Main 60 FPS deterministic animation loop
  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;

    if (isPlaying && !isScrubbing) {
      frameAcc += dt * FPS;
      while (frameAcc >= 1) {
        frameAcc -= 1;
        if (currentFrame < TOTAL_FRAMES - 1) {
          currentFrame++;
        } else {
          isPlaying = false;
          audio.setPlaying(false);
          if (isRecording) stopRecording();
          break;
        }
      }
    }

    audio.update(currentFrame / FPS, isPlaying);
    renderFrame(currentFrame);
    syncUI();

    requestAnimationFrame(tick);
  }

  // Initial render & launch
  renderFrame(0);
  syncUI();
  requestAnimationFrame(tick);
})();
</script>
